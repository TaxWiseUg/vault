<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="vaultGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="200" y1="200" x2="312" y2="312" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="#0F172A" />
  
  <!-- Subtle Glow Layer -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#vaultGrad)" opacity="0.15" />
  
  <!-- Outer Shield Silhouette -->
  <path d="M256 72L120 132V252C120 348 178 416 256 448C334 416 392 348 392 252V132L256 72Z" fill="url(#vaultGrad)" filter="url(#shadow)" />
  
  <!-- Shield Inset -->
  <path d="M256 96L142 147V248C142 330 191 388 256 416C321 388 370 330 370 248V147L256 96Z" fill="#1E1B4B" />

  <!-- Vault Outer Dial Ring -->
  <circle cx="256" cy="256" r="92" fill="#0F172A" stroke="url(#goldGrad)" stroke-width="12" />
  
  <!-- Dial Notches -->
  <circle cx="256" cy="180" r="5" fill="#FDE047" />
  <circle cx="256" cy="332" r="5" fill="#FDE047" />
  <circle cx="180" cy="256" r="5" fill="#FDE047" />
  <circle cx="332" cy="256" r="5" fill="#FDE047" />
  <circle cx="202" cy="202" r="4" fill="#FBBF24" />
  <circle cx="310" cy="202" r="4" fill="#FBBF24" />
  <circle cx="202" cy="310" r="4" fill="#FBBF24" />
  <circle cx="310" cy="310" r="4" fill="#FBBF24" />

  <!-- Inner Vault Mechanism Safe Core -->
  <circle cx="256" cy="256" r="56" fill="url(#emeraldGrad)" />
  <path d="M256 226V246M256 266V286M226 256H246M266 256H286" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="6" fill="#059669" />
</svg>
