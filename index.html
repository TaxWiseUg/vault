<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault</title>
    <meta name="description" content="Smart UGX budgeting and savings tracker for Home Rent, Internet, and Work Rent commitments with real-time multi-device cloud synchronization." />
    <meta property="og:title" content="Vault" />
    <meta property="og:description" content="Smart UGX budgeting and savings tracker for Home Rent, Internet, and Work Rent commitments with real-time multi-device cloud synchronization." />
    <script>
      // Gracefully prevent benign cross-origin iframe security inspection warnings from breaking React dev cycles
      window.addEventListener('error', function (e) {
        if (
          e &&
          (e.error?.name === 'SecurityError' ||
            (typeof e.message === 'string' && e.message.includes("Failed to read a named property '$$typeof' from 'Window'")))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e &&
          (e.reason?.name === 'SecurityError' ||
            (typeof e.reason?.message === 'string' && e.reason.message.includes("Failed to read a named property '$$typeof' from 'Window'")))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vault" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
